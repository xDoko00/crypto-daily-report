name: Günlük Kripto Raporu

# Rapor HER GÜN tam 08:00 TSİ'de gider (SABİT saat, alışkanlık için).
# GitHub cron tetikleme saati kayabildiğinden hedeften ÖNCE (07:35 TSİ) tetikleriz;
# report.py tam 08:00'e kadar bekleyip öyle gönderir (DELIVER_AT_TR). Böylece teslim sabittir.
on:
  schedule:
    # NÖBETÇİLER — GitHub cron'u saatlerce geciktirebiliyor, bu yüzden birden fazla
    # uyandırma noktası var. Hangisi vaktinde uyanırsa tam 08:00'e kadar bekleyip
    # gönderir; geç kalanlar "bugün gönderilmiş" görüp saniyeler içinde çıkar.
    - cron: "7 1 * * *"        # 04:07 TSİ — erken nöbetçi (yalnız public repo)
    - cron: "10 4 * * *"       # 07:10 TSİ
    - cron: "25 4 * * *"       # 07:25 TSİ
    - cron: "40 4 * * *"       # 07:40 TSİ
    - cron: "55 4 * * *"       # 07:55 TSİ
  workflow_dispatch:            # GitHub arayüzünden elle çalıştırma
    inputs:
      mode:
        description: "Gönderim modu: normal (kanal) / test (admin) / both (ikisi) / onizleme (admin, etiketsiz)"
        type: choice
        options:
          - normal
          - test
          - both
          - onizleme
        default: normal
      deliver_at:
        description: "İsteğe bağlı sabit teslim saati TSİ (HH:MM). Boşsa hemen gönderir."
        type: string
        default: ""
      sosyal_taslak_testi:
        description: "Sosyal taslak testi: rapor ÜRETİLMEZ/GÖNDERİLMEZ; reports/latest.json ile video üretilir (Telegram'a gönderilmez), ManyChat güncellenir, Buffer'da yalnız TASLAK oluşturulur (yayın yok)"
        type: boolean
        default: false

# Aynı anda tek çalışma yeter; üst üste binmeyi engelle.
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  rapor:
    # Erken nöbetçi 08:00'e kadar ~4 saat bekler. Public repoda Actions süresi
    # ücretsiz/sınırsız olduğu için bu bedava; private repoda kotayı yiyeceğinden
    # atlanır (o repolarda 07:10-07:55 nöbetçileri devrede kalır).
    if: ${{ !(github.event.schedule == '7 1 * * *' && github.event.repository.private) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 300  # erken nöbetçinin 08:00'e kadar beklemesini kapsar
    env:
      # Sosyal taslak testi (yalnız elle tetiklemede true olabilir; zamanlanmışta boş).
      SOSYAL_TASLAK: ${{ inputs.sosyal_taslak_testi && '1' || '' }}

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js kur (Claude Code CLI için)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Claude Code CLI kur
        if: ${{ !inputs.sosyal_taslak_testi }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Yazı tipi + ses araçları kur (kart & ses için)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core ffmpeg

      - name: Raporu üret ve gönder
        if: ${{ !inputs.sosyal_taslak_testi }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          # E-posta bülteni. Tanımlı değilse rapor yine gider, e-posta atlanır.
          BUTTONDOWN_API_KEY:      ${{ secrets.BUTTONDOWN_API_KEY }}
          # Klon sesli özet (ElevenLabs). Hata olursa ses atlanır, rapor yine gider.
          ELEVENLABS_API_KEY:      ${{ secrets.ELEVENLABS_API_KEY }}
          SESLI_OZET_ELEVENLABS:   "1"
          # Dikey video burada ÜRETİLMEZ: report.py raporu bu dosyaya yazar,
          # video aşağıdaki ayrı adımda rapor commit'inden SONRA çalışır.
          VIDEO_RAPOR_DOSYASI:     ${{ runner.temp }}/video-rapor.json
          # Zamanlanmış çalışmada sabit teslim 08:00 TSİ; manuel çalışmada kullanıcı
          # saat girdiyse o, girmediyse boş (hemen gönderir).
          DELIVER_AT_TR: ${{ github.event_name == 'schedule' && '08:00' || inputs.deliver_at }}
        run: |
          case "${{ inputs.mode }}" in
            test) python report.py --test ;;
            both) python report.py --both ;;
            onizleme) python report.py --onizleme ;;
            *)    python report.py ;;
          esac

      # Kanonik rapor (reports/) ve nöbetçi kilidi (state/) repoya işlenir.
      # reports/latest.json web sitesinin okuyacağı dosyadır; reports/YYYY/MM/
      # altındaki kopya tarihli arşivdir. state/video-son-kullanim.json b-roll
      # döndürme durumudur. PNG/OGG/MP4 bilerek commit'lenmez —
      # depo şişmesin diye ikisi de yalnız Telegram'a gider (brief §6.4).
      # TEK İSTİSNA: reports/ses/ altındaki web sesli özeti (mono 64 kbps MP3,
      # ≤1 MB, son 14 gün; ses_klon.web_ses_yaz). Site /bugun/ oynatıcısı onu
      # okuyor. `git add reports` 14 günden eski dosyaların silinmesini de işler.
      - name: Raporu ve takip durumunu kaydet
        if: ${{ !inputs.sosyal_taslak_testi && inputs.mode != 'test' && inputs.mode != 'onizleme' }}
        run: |
          # reports/ yazılamamış olabilir (diske yazma best-effort). O durumda
          # takip.json'ı yine de commit'lemeliyiz: yoksa nöbetçi kilidi kaydedilmez
          # ve ertesi gün ikinci rapor gider.
          git add state/takip.json || true
          [ -f state/video-son-kullanim.json ] && git add state/video-son-kullanim.json || true
          [ -d reports ] && git add reports || true
          if git diff --cached --quiet; then
            echo "degisiklik yok"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: gunluk rapor + takip durumu"
            git pull --rebase --autostash origin main || true
            git push || echo "push basarisiz (best-effort; rapor gonderildi)"
          fi

      # Sosyal taslak testi: rapor adımı atlandığı için sonraki adımların okuduğu
      # rapor dosyası mevcut reports/latest.json'dan kopyalanır.
      - name: "TEST: mevcut raporu hazırla"
        if: ${{ inputs.sosyal_taslak_testi }}
        env:
          VIDEO_RAPOR: ${{ runner.temp }}/video-rapor.json
        run: |
          cp reports/latest.json "$VIDEO_RAPOR"
          python -c "import json, os; print('test raporu:', json.load(open(os.environ['VIDEO_RAPOR'], encoding='utf-8'))['id'])"

      # ManyChat bot alanı `bugun_ozet` (DM'de "BUGÜN" yazana giden günün 3 başlığı).
      # Yalnız rapor bu çalışmada gönderildiyse; anahtar yoksa uyarıyla atlanır,
      # hata raporu bozmaz (sosyal.py her durumda 0 döner).
      - name: ManyChat günün özetini güncelle
        if: ${{ inputs.sosyal_taslak_testi || (inputs.mode != 'test' && inputs.mode != 'onizleme') }}
        timeout-minutes: 3
        continue-on-error: true
        env:
          MANYCHAT_API_KEY:        ${{ secrets.MANYCHAT_API_KEY }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          VIDEO_RAPOR:             ${{ runner.temp }}/video-rapor.json
        run: |
          if [ -f "$VIDEO_RAPOR" ]; then
            python sosyal.py manychat --rapor "$VIDEO_RAPOR" || true
          else
            echo "bu calismada rapor gonderilmedi, ManyChat atlandi"
          fi

      # Dikey video (video/): rapor gönderilip commit'lendikten SONRA, en fazla 8 dk.
      # Şimdilik yalnız admin'e gider; hata/zaman aşımı yalnız loglanır, adım
      # kırmızıya dönmez. Rapor bu çalışmada gönderilmediyse (nöbetçi erken
      # çıktıysa) dosya yoktur, adım bir şey yapmaz.
      - name: Video önizlemesini üret ve gönder
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Video seslendirmesi klon sesle (video/servisler.py) — rapor adımıyla aynı.
          ELEVENLABS_API_KEY:      ${{ secrets.ELEVENLABS_API_KEY }}
          SESLI_OZET_ELEVENLABS:   "1"
          VIDEO_OZET:              "1"
          VIDEO_HEDEF:             "admin"
          VIDEO_RAPOR:             ${{ runner.temp }}/video-rapor.json
          # Üretilen videonun kopyası; sonraki sosyal medya adımı bunu kullanır.
          VIDEO_KOPYA:             ${{ runner.temp }}/gunaydin.mp4
        run: |
          if [ -f "$VIDEO_RAPOR" ] && [ "$SOSYAL_TASLAK" = "1" ]; then
            # Taslak testi: yalnız üret (VIDEO_KOPYA'ya yazılır), Telegram'a GÖNDERME.
            timeout 480 python -m video.calistir --rapor "$VIDEO_RAPOR" --gonderme || true
          elif [ -f "$VIDEO_RAPOR" ]; then
            python -c "import json, os; from video import calistir; calistir.izole_calistir(json.load(open(os.environ['VIDEO_RAPOR'], encoding='utf-8')))" || true
          else
            echo "bu calismada rapor gonderilmedi, video atlandi"
          fi

      # Sosyal medya (sosyal.py): video GitHub Release'e (tag gunluk-video, 7 gün
      # saklama) yüklenir, Buffer'da Instagram hikâye + X + TikTok'a SOSYAL_GECIKME_DK
      # dakika sonrasına zamanlanır; saat + gönderi id'leri admin Telegram'a gider.
      # Kapatmak için SOSYAL_YAYIN=kapali. Çift gönderi: state/sosyal-son.json +
      # Buffer'da o gün API'den zamanlanmış gönderi kontrolü. Hata raporu bozmaz.
      # Taslak testinde (SOSYAL_TASLAK=1, job env) Buffer'da yalnız taslak oluşur,
      # kilit yazılmaz, asset adları `-test` eklidir.
      - name: Sosyal medyaya zamanla
        if: ${{ inputs.sosyal_taslak_testi || (inputs.mode != 'test' && inputs.mode != 'onizleme') }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          BUFFER_API_KEY:          ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GH_TOKEN:                ${{ github.token }}
          # IG hikâyesi fragmanı (video/fragman.py): tek ek seslendirme + BTC grafiği.
          ELEVENLABS_API_KEY:      ${{ secrets.ELEVENLABS_API_KEY }}
          COINGECKO_DEMO_API_KEY:  ${{ secrets.COINGECKO_DEMO_API_KEY }}
          SOSYAL_YAYIN:            "acik"
          SOSYAL_GECIKME_DK:       "30"
          VIDEO_RAPOR:             ${{ runner.temp }}/video-rapor.json
          VIDEO_KOPYA:             ${{ runner.temp }}/gunaydin.mp4
        run: |
          if [ ! -f "$VIDEO_RAPOR" ]; then
            echo "bu calismada rapor gonderilmedi, sosyal atlandi"
          elif [ ! -f "$VIDEO_KOPYA" ]; then
            echo "video uretilmedi, sosyal atlandi"
          else
            python sosyal.py paylas --rapor "$VIDEO_RAPOR" --video "$VIDEO_KOPYA" || true
          fi

      # Video b-roll döndürme durumu (state/video-son-kullanim.json) ve sosyal
      # çift gönderi kilidi (state/sosyal-son.json) ayrı commit.
      - name: Video durumunu kaydet
        # always(): video/sosyal adımı zaman aşımına uğrasa da b-roll durumu ve
        # sosyal çift gönderi kilidi (state/sosyal-son.json) kaybolmasın.
        # Taslak testinde atlanır: üretilen videonun b-roll döndürmesi gerçek akışı
        # etkilemesin (sosyal kilidi zaten yazılmıyor).
        if: ${{ always() && !inputs.sosyal_taslak_testi && inputs.mode != 'test' && inputs.mode != 'onizleme' }}
        run: |
          [ -f state/video-son-kullanim.json ] && git add state/video-son-kullanim.json || true
          [ -f state/sosyal-son.json ] && git add state/sosyal-son.json || true
          if git diff --cached --quiet; then
            echo "degisiklik yok"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: video durumu" || true
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "::warning::video durumu rebase cakismasi, kaydedilmedi (best-effort)"
              exit 0
            fi
            git push || echo "push basarisiz (best-effort)"
          fi
